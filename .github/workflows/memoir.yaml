name: SQL optimizer verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  local-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p optd-core --lib
      - run: cargo test --locked -p optd-datafusion-repr -p optd-datafusion-repr-adv-cost -p optd-gungnir --lib
      - run: cargo clippy --locked -p optd-datafusion-bridge --example memoir --no-deps
      - run: cargo run --locked -p optd-datafusion-bridge --example memoir -- evidence/memoir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-memo-evidence
          path: evidence/memoir
